name: LabStreamGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gateway:
    name: Gateway build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check gateway
        run: cargo check --locked -p wsrx --bin labstreamgate

      - name: Test transport library
        run: cargo test --locked -p wsrx --lib

      - name: Lint gateway
        run: cargo clippy --locked -p wsrx --bin labstreamgate -- -D warnings

  container:
    name: Container image
    runs-on: ubuntu-24.04
    needs: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag labstreamgate:ci .
